name: Run tests

# Run on every branch so the ES5 lint (and other static checks) gate feature
# branches before the slow Open edX Docker image build, not just release/main.
on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install .[dev]
      - name: Test lint, types, and format
        run: make test
