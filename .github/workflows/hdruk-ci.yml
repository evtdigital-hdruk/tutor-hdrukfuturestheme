# HDR UK fork CI.
#
# Why this file exists: test.yml is inherited from overhangio/tutor-indigo
# and is left alone so rebases onto upstream do not conflict. This workflow
# runs the same Makefile `test` targets (pylint, mypy, black, the node unit
# test and the ES5 lint) on the fork's own branches, on a Python version
# that can install the Tutor release pinned in pyproject.toml, one target
# per step so a failure names the check that failed.
#
# This workflow is informational. It must NOT be made a required status
# check or otherwise gate merges yet.

name: HDR UK CI

on:
  push:
    branches:
      - "hdr-uk/**"
      - "upgrade/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Static checks and JS tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        run: pip install .[dev]

      - name: Lint (pylint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-lint

      - name: Type check (mypy)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-types

      - name: Format check (black)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-format

      - name: JS unit tests (node)
        if: ${{ !cancelled() }}
        run: make test-js

      - name: ES5 lint of theme JS
        if: ${{ !cancelled() }}
        run: make test-js-es5
